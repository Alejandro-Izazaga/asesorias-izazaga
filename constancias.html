<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verificar constancia · Izazaga Asesorías</title>
<meta name="color-scheme" content="light dark">
<script>
(function(){var t=null;try{t=localStorage.getItem("tema")}catch(e){}
if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();
</script>
<meta name="description" content="Verifique la autenticidad de una constancia de Izazaga Asesorías con su folio o código QR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef2f8; --card:#fff; --ink:#0f1f45; --head:#12295a; --mut:#5a6788; --soft:#f3f6fb; --line:#dde3ee;
  --ok:#0b6b46; --bad:#a32d2d; --acc:#2a5bd7; --btn:#12295a; --btnh:#1b3b80; --inp:#fff; --ph:#8f9bb6;
  --tri:.075; --glow:#2a5bd71a;
  --f:"Geist","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#060c1b; --card:#0e1830; --ink:#e8edf8; --head:#e6edff; --mut:#93a3c4; --soft:#14213f; --line:#233559;
  --ok:#4ade80; --bad:#fb7185; --acc:#6aa0ff; --btn:#2f5fe0; --btnh:#4574f0; --inp:#0a1429; --ph:#5b6c92;
  --tri:.1; --glow:#3b6df028;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.6 var(--f);color:var(--ink);min-height:100vh;position:relative;
  background:radial-gradient(900px 520px at 12% -5%,var(--glow),transparent 65%),radial-gradient(800px 500px at 100% 100%,var(--glow),transparent 65%);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
.bgfx{position:fixed;z-index:0;pointer-events:none;color:var(--head);opacity:var(--tri)}
.bgfx path{fill:currentColor}
.bgfx.a{width:min(130vw,820px);right:-18vw;bottom:-14vh}
.bgfx.b{width:min(70vw,380px);left:-14vw;top:70px;transform:rotate(180deg);opacity:calc(var(--tri)*.8)}
header,main{position:relative;z-index:1}
a{color:var(--acc)}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:72px}
.brand{display:flex;align-items:center;gap:10px;color:var(--head);text-decoration:none;font-weight:600}
.brand svg{width:22px;height:22px}
.back{color:var(--mut);text-decoration:none;font-size:.92rem}
.right{display:flex;align-items:center;gap:14px}
.tg{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--card);color:var(--head);border:1px solid var(--line);border-radius:50%}
.tg:hover{border-color:var(--acc);color:var(--acc)}
.tg svg{width:20px;height:20px}
.tg .sun{display:none}
:root[data-theme="dark"] .tg .sun{display:block}
:root[data-theme="dark"] .tg .moon{display:none}
.back:hover{color:var(--head)}
h1{font:600 clamp(1.9rem,6vw,2.5rem)/1.12 var(--f);letter-spacing:-.03em;color:var(--head);margin:40px 0 10px}
.lead{color:var(--mut);margin:0 0 28px;max-width:46ch}
label{display:block;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.line{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;background:var(--inp);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font:500 1.1rem var(--f);letter-spacing:.04em;padding:15px 18px}
input::placeholder{color:var(--ph);letter-spacing:0}
input:focus{outline:none;border-color:var(--head)}
button{font:500 1rem var(--f);cursor:pointer;border-radius:12px}
.pri{background:var(--btn);color:#fff;border:0;padding:0 26px;font-weight:600}
.pri:hover{background:var(--btnh)}
.link{background:none;border:0;color:var(--head);padding:0;margin-top:16px;font-size:.95rem;display:inline-flex;align-items:center;gap:8px}
.link:hover{color:var(--acc)}
.link svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

#res{margin-top:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 22px 24px;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.head{text-align:center}
.badge{width:58px;height:58px;border-radius:50%;background:var(--btn);margin:0 auto 14px;display:grid;place-items:center;color:#fff}
.badge svg{width:28px;height:28px}
.st{color:var(--ok);font-weight:600;font-size:.93rem;margin:0 0 6px}
.who{font:600 clamp(1.55rem,5.2vw,2.1rem)/1.18 var(--f);letter-spacing:-.025em;color:var(--head);margin:0 0 4px}
.cur{color:var(--mut);margin:0 0 10px}
.fol{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 14px;font-size:.88rem;color:var(--mut);font-variant-numeric:tabular-nums}
.fol b{color:var(--head);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:24px 0 8px}
.cell{background:var(--soft);border-radius:14px;padding:12px 14px}
.cell span{display:block;font-size:.8rem;color:var(--mut)}
.cell b{display:block;font-weight:600;color:var(--head);font-size:1.02rem;line-height:1.3}
.cell small{display:block;color:var(--mut);font-size:.82rem;margin-top:1px}
.cell.w{grid-column:1/-1}
h2{font:600 .98rem var(--f);color:var(--head);margin:26px 0 10px}
ul{list-style:none;margin:0;padding:0}
.req li,.know li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.req li:last-child,.know li:last-child{border-bottom:1px solid var(--line)}
.req svg,.know svg{flex:none;width:19px;height:19px;margin-top:3px}
.req .y{color:var(--ok)}.req .n{color:var(--bad)}.know svg{color:var(--head)}
.req small{display:block;color:var(--mut)}
.apt li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
.apt li:last-child{border-bottom:1px solid var(--line)}
.apt b{font-weight:500}.apt span{color:var(--head);font-weight:600}
.sign{margin-top:30px;text-align:center}
.sign img{display:block;max-height:74px;max-width:220px;margin:0 auto 4px}
.sign .ln{width:230px;max-width:80%;height:1px;background:var(--head);margin:0 auto 8px}
.sign b{display:block;color:var(--head)}
.sign small{display:block;color:var(--mut)}
.emit{margin:18px 0 0;text-align:center;color:var(--mut);font-size:.9rem}
.note{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:.85rem}
.bad{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;animation:in .35s ease-out}
.bad h3{margin:0 0 8px;font:600 1.3rem var(--f);color:var(--bad)}
.bad p{margin:0 0 18px;color:var(--mut)}
.wa{display:inline-block;background:var(--btn);color:#fff;text-decoration:none;font-weight:600;border-radius:12px;padding:12px 20px}
footer{margin:48px 0 0;padding:0 0 40px;color:var(--mut);font-size:.9rem;text-align:center}

dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);padding:0;width:min(92vw,400px)}
dialog::backdrop{background:#0a1226d9}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:600;color:var(--head)}
.x{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 14px;font-size:.9rem}
.vw{position:relative;aspect-ratio:1;background:#02060c;overflow:hidden}
.vw video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fr{position:absolute;inset:17%;border:2px solid #ffffffc0;border-radius:18px;pointer-events:none}
#qrmsg{margin:0;padding:15px 18px;color:var(--mut);font-size:.93rem;text-align:center}
@media(max-width:480px){.line{flex-direction:column}.pri{padding:15px}.grid{grid-template-columns:1fr}.card{padding:26px 16px 22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg class="bgfx a" viewBox="0 0 100 90" aria-hidden="true"><path id="bga"/></svg>
<svg class="bgfx b" viewBox="0 0 100 90" aria-hidden="true"><path id="bgb"/></svg>
<header><div class="wrap">
  <a class="brand" href="./"><svg viewBox="0 0 100 90" aria-hidden="true"><path id="logo" fill="currentColor"/></svg>Izazaga Asesorías</a>
  <div class="right">
    <a class="back" href="./">Volver al catálogo</a>
    <button class="tg" id="theme" type="button" aria-label="Cambiar a tono oscuro" title="Cambiar tono">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</div></header>

<main class="wrap">
  <h1>Verificar constancia</h1>
  <p class="lead">Confirme que una constancia fue emitida por Izazaga Asesorías. Ingrese su folio o escanee el código QR.</p>

  <label for="folio">Folio</label>
  <div class="line">
    <input type="text" id="folio" placeholder="Folio impreso en la constancia" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="pri" id="check">Verificar</button>
  </div>
  <button class="link" id="scan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></svg>
    Escanear código QR
  </button>

  <div id="res" aria-live="polite"></div>
  <footer>Registro de constancias de Alejandro Izazaga. Aclaraciones por <a id="wa-foot" href="#" rel="noopener">WhatsApp</a>.</footer>
</main>

<dialog id="dlg" aria-label="Escáner de código QR">
  <div class="dh">Escanear código QR <button class="x" id="close">Cerrar</button></div>
  <div class="vw"><video id="cam" playsinline muted></video><div class="fr"></div></div>
  <p id="qrmsg" role="status">Iniciando cámara…</p>
  <canvas id="cv" hidden></canvas>
</dialog>

<script>
/* ============================================================
   1) DATOS COMUNES DE CADA CURSO (van en todas sus constancias)
   ============================================================ */
const CURSOS = {
  algebra: {
    nombre: "Álgebra",
    modalidad: "Grupo en línea por Teams",
    horas: 30, sesiones: 20, minutos: 90,
    periodo: "14 de octubre al 28 de noviembre de 2026",
    minCalif: 70,      /* sobre 100 (7/10) */
    minAsist: 80       /* porcentaje */
  }
};
const EMISOR = { nombre: "Alejandro Izazaga", cargo: "Asesor académico de Matemáticas y Física" };
const LEYENDA = "Constancia emitida por el instructor. No cuenta con aval institucional.";

/* ============================================================
   2) REGISTRO DE CONSTANCIAS ENTREGADAS
   Una entrada por constancia. La llave es el folio en MAYÚSCULAS.
   Registre solo constancias ya otorgadas y sin datos de contacto.
   Plantilla:

   "FOLIO-01": {
     nombre: "Nombre completo del titular",
     curso: "algebra",
     emision: "Lugar, día de mes de año",
     califFinal: 0,            // sobre 100
     asistencias: 0,           // sesiones asistidas (de las del curso)
     tiempoClase: "0 h 00 min",// opcional
     kahoot: 0, tareas: 0,     // opcionales, sobre 100
     conocimientos: ["Tema 1", "Tema 2"],
     aptitudes: [ {n:"Puntualidad", v:"Alta"} ]
   },
   ============================================================ */
const CONSTANCIAS = {
};

/* Vista de muestra con texto genérico: constancias.html?demo */
const DEMO = new URLSearchParams(location.search).has("demo");
if(DEMO){
  CONSTANCIAS["MUESTRA-00"] = {
    nombre:"Nombre del titular", curso:"algebra", emision:"Lugar, fecha de emisión",
    califFinal:85, asistencias:19, tiempoClase:"28 h 10 min", kahoot:82, tareas:88,
    conocimientos:["Expresiones algebraicas","Productos notables","División sintética y regla de Ruffini"],
    aptitudes:[{n:"Puntualidad",v:"Alta"},{n:"Nivel de abstracción",v:"Alto"}]
  };
}

const WA = "525510307462";
const $ = id => document.getElementById(id);
const norm = s => (s||"").trim().toUpperCase().replace(/\s+/g,"");
const waLink = t => "https://wa.me/"+WA+"?text="+encodeURIComponent(t);
$("wa-foot").href = waLink("Hola, Izazaga. Tengo una duda sobre una constancia.");

function el(tag, cls, text){
  const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e;
}
const NS="http://www.w3.org/2000/svg";
function icon(d,w){
  const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-width",w||2.2); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round");
  s.setAttribute("aria-hidden","true");
  const p=document.createElementNS(NS,"path"); p.setAttribute("d",d); s.appendChild(p); return s;
}
const CHECK="M20 6 9 17l-5-5", CROSS="M18 6 6 18M6 6l12 12";
function sierp(x,y,s,d,o){
  if(d===0){o.push("M"+x+" "+y+"L"+(x+s)+" "+y+"L"+(x+s/2)+" "+(y-s*0.866)+"Z");return;}
  const h=s/2; sierp(x,y,h,d-1,o); sierp(x+h,y,h,d-1,o); sierp(x+h/2,y-h*0.866,h,d-1,o);
}
(function(){
  const b=[];sierp(2,86,96,3,b);$("logo").setAttribute("d",b.join(""));
  const a=[];sierp(1,88,98,6,a);$("bga").setAttribute("d",a.join(""));
  const c=[];sierp(1,88,98,5,c);$("bgb").setAttribute("d",c.join(""));
})();
function setTema(t){
  document.documentElement.setAttribute("data-theme",t);
  $("theme").setAttribute("aria-label",t==="dark"?"Cambiar a tono claro":"Cambiar a tono oscuro");
  try{localStorage.setItem("tema",t)}catch(e){}
}
$("theme").onclick=()=>setTema(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
$("theme").setAttribute("aria-label",document.documentElement.getAttribute("data-theme")==="dark"?"Cambiar a tono claro":"Cambiar a tono oscuro");

const n1 = x => (Math.round(x*10)/10).toString();
function cell(k,v,sub,wide){
  const d=el("div","cell"+(wide?" w":"")); d.appendChild(el("span",null,k)); d.appendChild(el("b",null,v));
  if(sub) d.appendChild(el("small",null,sub)); return d;
}

function show(folio){
  const f=norm(folio), box=$("res");
  box.textContent=""; if(!f) return;
  const c=CONSTANCIAS[f], k=c&&CURSOS[c.curso];
  let node;
  if(!c||!k){
    node=el("div","bad");
    node.appendChild(el("h3",null,"Folio no encontrado"));
    node.appendChild(el("p",null,"El folio no consta en el registro. Revise que esté escrito igual que en la constancia o solicite la confirmación al asesor."));
    const a=el("a","wa","Solicitar confirmación por WhatsApp");
    a.href=waLink("Hola, Izazaga. Solicito confirmar el folio "+f+" de una constancia."); a.rel="noopener";
    node.appendChild(a);
  }else{
    node=el("article","card");
    const h=el("div","head");
    const bd=el("div","badge"); bd.appendChild(icon(CHECK,2.6)); h.appendChild(bd);
    h.appendChild(el("p","st","Constancia verificada"));
    h.appendChild(el("h2","who",c.nombre));
    h.lastChild.style.cssText="";
    h.appendChild(el("p","cur","Constancia · "+k.nombre));
    const fo=el("span","fol","Folio "); fo.appendChild(el("b",null,f)); h.appendChild(fo);
    node.appendChild(h);

    const asistPct=Math.round(c.asistencias/k.sesiones*100);
    const g=el("div","grid");
    g.appendChild(cell("Curso",k.nombre,k.modalidad));
    g.appendChild(cell("Duración",k.horas+" horas",k.sesiones+" sesiones de "+k.minutos+" min"));
    g.appendChild(cell("Periodo",k.periodo,"",true));
    g.appendChild(cell("Calificación final",n1(c.califFinal/10)+" / 10","("+n1(c.califFinal)+" / 100)"));
    g.appendChild(cell("Asistencia en vivo",c.asistencias+" de "+k.sesiones+" sesiones","("+asistPct+" %)"));
    if(c.tiempoClase) g.appendChild(cell("Tiempo en clase",c.tiempoClase,"de "+k.horas+" h programadas"));
    if(c.kahoot!==undefined || c.tareas!==undefined){
      const parts=[]; if(c.kahoot!==undefined) parts.push("Kahoot "+n1(c.kahoot)); if(c.tareas!==undefined) parts.push("Tareas "+n1(c.tareas));
      g.appendChild(cell("Evaluación (sobre 100)",parts.join(" · "),""));
    }
    node.appendChild(g);

    node.appendChild(el("h2",null,"Requisitos de acreditación"));
    const rq=el("ul","req");
    [[c.califFinal>=k.minCalif,"Calificación final mínima de "+(k.minCalif/10)+"/10 ("+k.minCalif+"/100)","Obtenida: "+n1(c.califFinal/10)+"/10"],
     [asistPct>=k.minAsist,"Asistencia en vivo mínima de "+k.minAsist+" %","Máximo "+Math.round(k.sesiones*(100-k.minAsist)/100)+" faltas de "+k.sesiones+". Registradas: "+(k.sesiones-c.asistencias)]
    ].forEach(([ok,t,s])=>{
      const li=el("li"); li.appendChild(icon(ok?CHECK:CROSS,2.6)); li.firstChild.setAttribute("class",ok?"y":"n");
      const d=el("div"); d.appendChild(el("span",null,t)); d.appendChild(el("small",null,s)); li.appendChild(d); rq.appendChild(li);
    });
    node.appendChild(rq);

    if(c.conocimientos&&c.conocimientos.length){
      node.appendChild(el("h2",null,"Conocimientos acreditados"));
      const ul=el("ul","know"); c.conocimientos.forEach(t=>{const li=el("li"); li.appendChild(icon(CHECK,2.4)); li.appendChild(el("span",null,t)); ul.appendChild(li);}); node.appendChild(ul);
    }
    if(c.aptitudes&&c.aptitudes.length){
      node.appendChild(el("h2",null,"Aptitudes"));
      const ul=el("ul","apt"); c.aptitudes.forEach(a=>{const o=typeof a==="string"?{n:a}:a,li=el("li"); li.appendChild(el("b",null,o.n)); li.appendChild(el("span",null,o.v!==undefined?String(o.v):"")); ul.appendChild(li);}); node.appendChild(ul);
    }

    const sg=el("div","sign");
    const im=document.createElement("img"); im.src="firma.png"; im.alt="Firma de "+EMISOR.nombre;
    im.onerror=()=>im.remove(); sg.appendChild(im);
    sg.appendChild(el("div","ln")); sg.appendChild(el("b",null,EMISOR.nombre)); sg.appendChild(el("small",null,EMISOR.cargo));
    node.appendChild(sg);
    if(c.emision) node.appendChild(el("p","emit","Lugar y fecha de emisión: "+c.emision));
    node.appendChild(el("p","note",LEYENDA));
  }
  box.appendChild(node);
  node.scrollIntoView({behavior:"smooth",block:"start"});
}

$("check").onclick=()=>show($("folio").value);
$("folio").addEventListener("keydown",e=>{if(e.key==="Enter") show($("folio").value);});
function fromText(t){const m=/validar=([^&\s]+)/i.exec(t||"");return m?decodeURIComponent(m[1]):(t||"").trim();}
function fromHash(){const m=/validar=([^&]+)/i.exec(location.hash);if(m){const f=decodeURIComponent(m[1]);$("folio").value=f;show(f);}}
window.addEventListener("hashchange",fromHash);
fromHash();
if(DEMO && !location.hash){ $("folio").value="MUESTRA-00"; show("MUESTRA-00"); }

const dlg=$("dlg"); let stream=null,raf=0,detector=null,jsqr=null;
function loadJsQR(){
  if(window.jsQR) return Promise.resolve(); if(jsqr) return jsqr;
  jsqr=new Promise((ok,fail)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js";s.onload=ok;s.onerror=fail;document.head.appendChild(s);});
  return jsqr;
}
function stop(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$("cam").srcObject=null;}
function closeScan(){stop();if(dlg.open)dlg.close();}
$("close").onclick=closeScan; dlg.addEventListener("close",stop);
async function startScan(){
  const msg=$("qrmsg"); msg.textContent="Iniciando cámara…";
  if(typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent="Este navegador no permite usar la cámara. Ingrese el folio manualmente.";return;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});}
  catch(e){msg.textContent="No se pudo activar la cámara. Permita el acceso o ingrese el folio manualmente.";return;}
  const v=$("cam"); v.srcObject=stream; await v.play();
  msg.textContent="Coloque el código QR dentro del marco.";
  if("BarcodeDetector" in window){try{detector=new BarcodeDetector({formats:["qr_code"]});}catch(e){detector=null;}}
  if(!detector){try{await loadJsQR();}catch(e){msg.textContent="No se pudo cargar el lector de QR. Ingrese el folio manualmente.";stop();return;}}
  const cv=$("cv"),ctx=cv.getContext("2d",{willReadFrequently:true});
  const tick=async()=>{
    if(!stream) return;
    if(v.readyState>=2){
      let text=null;
      try{
        if(detector){const r=await detector.detect(v);if(r.length)text=r[0].rawValue;}
        else{cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0,cv.width,cv.height);
          const im=ctx.getImageData(0,0,cv.width,cv.height);const r=window.jsQR(im.data,im.width,im.height);if(r)text=r.data;}
      }catch(e){}
      if(text){const f=fromText(text);closeScan();$("folio").value=f;show(f);return;}
    }
    raf=requestAnimationFrame(tick);
  };
  tick();
}
$("scan").onclick=startScan;
document.addEventListener("visibilitychange",()=>{if(document.hidden)closeScan();});
</script>
</body>
</html>
